          V4: { word: 'It depends.', ans: '時と場合による、状況次第だ', keys: ['場合', '状況', '次第'], exp: 'depend on ～ から派生した頻出会話表現。' },
          V5: { word: "Can I have ...? / I'd like ...", ans: '注文時の丁寧な表現（「～をいただけますか」）', keys: ['注文', '丁寧', 'いただけます', 'ください', '欲し'], exp: 'I want は直接的すぎて強い印象を与えるため、注文時はこれらを使う。' },
          V6: { word: 'bet / think / guess の確信度の順番（高い順）', ans: 'bet > think > guess', keys: ['bet > think > guess', 'bet>think>guess', 'bet＞think＞guess', 'bet, think, guess', 'bet think guess'], exp: 'bet（強い確信）＞ think（中立）＞ guess（確信のない推測）。' }
        }
      }
    ];

    /**
     * ============================================================
     * アプリ状態管理（各場面の入力・採点結果を保持）
     * ============================================================
     */
    const sceneStates = {};
    SCENES.forEach((s) => {
      sceneStates[s.id] = createEmptySceneState();
    });

    function createEmptySceneState() {
      return {
        blanks: {},       // { B1: 'of' }
        vocabs: {},       // { V1: '狙う' }
        vocabAuto: {},    // { V1: true/false }
        vocabOverride: {},// { V1: true/false } (手動上書き)
        trans: {},        // { T1: '和訳...' }
        transGrade: {},   // { T1: 'ok' | 'close' | 'ng' }
        graded: false,
        showAllModels: false
      };
    }

    const appState = {
      activeSceneId: '1',
      mockMode: false,
      mockScenes: [] // ランダムに選ばれた3場面のID配列
    };

    /**
     * ============================================================
     * DOM要素参照 & ユーティリティ
     * ============================================================
     */
    const el = {
      normalTabs: document.getElementById('normal-tabs'),
      mockBar: document.getElementById('mock-bar'),
      mockSceneTabs: document.getElementById('mock-scene-tabs'),
      btnMockToggle: document.getElementById('btn-mock-toggle'),
      mockBtnIcon: document.getElementById('mock-btn-icon'),
      mockBtnLabel: document.getElementById('mock-btn-label'),
      btnMockSummary: document.getElementById('btn-mock-summary'),
      mockModal: document.getElementById('mock-modal'),
      mockModalBody: document.getElementById('mock-modal-body'),
      btnCloseModal: document.getElementById('btn-close-modal'),
      btnMockNew: document.getElementById('btn-mock-new'),
      btnMockExit: document.getElementById('btn-mock-exit'),

      btnGrade: document.getElementById('btn-grade'),
      btnToggleAnswers: document.getElementById('btn-toggle-answers'),
      btnResetScene: document.getElementById('btn-reset-scene'),
      scoreBadges: document.getElementById('score-badges'),

      scriptTitle: document.getElementById('script-title'),
      scriptPane: document.getElementById('script-pane'),
      answerPane: document.getElementById('answer-pane'),
      sheetCounts: document.getElementById('sheet-counts'),
      toast: document.getElementById('toast')
    };

    let toastTimer = null;
    function showToast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.add('hidden'), 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getScene(id) {
      return SCENES.find((s) => s.id === id) || SCENES[0];
    }

    /**
     * ============================================================
     * 再帰パーサー：ネストした [T1: ... [V1: ...] [B1: ...] ...] を安全にHTML化
     * ============================================================
     */
    function parseScriptText(text, sceneId) {
      const st = sceneStates[sceneId];
      let html = '';
      let i = 0;

      while (i < text.length) {
        if (text[i] === '[') {
          const rest = text.slice(i);
          const match = rest.match(/^\[(T|V|B)(\d+):\s*/);
          if (match) {
            const tagType = match[1];
            const tagNum = match[2];
            const qid = `${tagType}${tagNum}`;
            const startInner = i + match[0].length;

            // 対応する閉じ括弧 ']' をネスト深度で探索
            let depth = 1;
            let j = startInner;
            while (j < text.length && depth > 0) {
              if (text[j] === '[') depth++;
              else if (text[j] === ']') depth--;
              if (depth > 0) j++;
            }

            const innerRaw = text.slice(startInner, j);
            const innerHtml = parseScriptText(innerRaw, sceneId);

            if (tagType === 'T') {
              html += `<span id="script-${qid}" class="trans-span" data-qid="${qid}"><button type="button" data-jump-target="card-${qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1 rounded text-[11px] font-extrabold bg-amber-500 hover:bg-amber-600 text-white align-middle cursor-pointer transition-colors shadow-xs">訳${tagNum}</button>${innerHtml}</span>`;
            } else if (tagType === 'V') {
              html += `<span id="script-${qid}" class="vocab-span" data-qid="${qid}"><button type="button" data-jump-target="card-${qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1 rounded text-[11px] font-extrabold bg-sky-600 hover:bg-sky-700 text-white align-middle cursor-pointer transition-colors shadow-xs">単${tagNum}</button>${innerHtml}</span>`;
            } else if (tagType === 'B') {
              const savedVal = st.blanks[qid] || '';
              const scene = getScene(sceneId);
              const blankMeta = scene.blanks[qid];
              const isCorrect =
                st.graded &&
                blankMeta &&
                blankMeta.ans.some((a) => a.toLowerCase() === savedVal.trim().toLowerCase());

              let inputColor = 'border-slate-300 bg-white text-slate-900 focus:border-navy focus:ring-navy/20';
              if (st.graded) {
                inputColor = isCorrect
                  ? 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold'
                  : 'border-rose-500 bg-rose-50 text-rose-900 font-bold';
              }

              const showCorrection = (st.graded && !isCorrect) || st.showAllModels;
              const correctLabel = blankMeta ? blankMeta.ans[0] : '';

              html += `<span id="script-${qid}" class="inline-flex items-center gap-1 mx-0.5 align-baseline"><button type="button" data-jump-target="card-${qid}" class="jump-to-sheet text-[11px] font-extrabold text-slate-500 hover:text-navy">(${tagNum})</button><input type="text" data-blank-id="${qid}" value="${escapeHtml(savedVal)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="..." class="inline-blank-input w-20 sm:w-24 px-2 py-0.5 text-sm sm:text-[15px] rounded-lg border-2 focus:outline-none focus:ring-2 transition-colors ${inputColor}" />${
                showCorrection
                  ? `<span class="text-xs font-extrabold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">${escapeHtml(correctLabel)}</span>`
                  : ''
              }</span>`;
            }

            i = j + 1;
            continue;
          }
        }
        html += escapeHtml(text[i]);
        i++;
      }

      return html;
    }

    /**
     * ============================================================
     * スコア計算ロジック
     * ============================================================
     */
    function getVocabIsCorrect(sceneId, qid) {
      const st = sceneStates[sceneId];
      if (typeof st.vocabOverride[qid] === 'boolean') {
        return st.vocabOverride[qid];
      }
      return Boolean(st.vocabAuto[qid]);
    }

    function computeSceneScore(sceneId) {
      const scene = getScene(sceneId);
      const st = sceneStates[sceneId];

      const blankKeys = Object.keys(scene.blanks);
      let blankCorrect = 0;
      blankKeys.forEach((k) => {
        const val = (st.blanks[k] || '').trim().toLowerCase();
        if (scene.blanks[k].ans.some((a) => a.toLowerCase() === val)) {
          blankCorrect++;
        }
      });

      const vocabKeys = Object.keys(scene.vocabs);
      let vocabCorrect = 0;
      vocabKeys.forEach((k) => {
        if (getVocabIsCorrect(sceneId, k)) vocabCorrect++;
      });

      const transKeys = Object.keys(scene.translations);
      let transOk = 0;
      let transClose = 0;
      let transGraded = 0;
      transKeys.forEach((k) => {
        const g = st.transGrade[k];
        if (g) transGraded++;
        if (g === 'ok') transOk++;
        if (g === 'close') transClose++;
      });

      return {
        blankCorrect,
        blankTotal: blankKeys.length,
        vocabCorrect,
        vocabTotal: vocabKeys.length,
        transOk,
        transClose,
        transGraded,
        transTotal: transKeys.length
      };
    }

    /**
     * ============================================================
     * ナビゲーション・ヘッダー描画
     * ============================================================
     */
    function renderTabs() {
      // 通常モードのタブ
      el.normalTabs.innerHTML = '';
      SCENES.forEach((s) => {
        const active = !appState.mockMode && appState.activeSceneId === s.id;
        const st = sceneStates[s.id];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all border shrink-0 flex items-center gap-1.5 ${
          active
            ? 'bg-navy text-white border-navy shadow-sm'
            : 'bg-white text-slate-600 border-slate-200 hover:border-navy/40 hover:text-navy'
        }`;
        btn.innerHTML = `<span>${escapeHtml(s.tabLabel)}</span>${
          st.graded ? '<span class="w-2 h-2 rounded-full bg-emerald-400"></span>' : ''
        }`;
        btn.addEventListener('click', () => {
          appState.activeSceneId = s.id;
          renderAll();
        });
        el.normalTabs.appendChild(btn);
      });

      // 模試モード表示切替
      el.normalTabs.classList.toggle('hidden', appState.mockMode);
      el.mockBar.classList.toggle('hidden', !appState.mockMode);

      if (appState.mockMode) {
        el.btnMockToggle.className =
          'w-full sm:w-auto px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center justify-center gap-1.5 bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100';
        el.mockBtnIcon.textContent = '✕';
        el.mockBtnLabel.textContent = '本番模試を終了';

        el.mockSceneTabs.innerHTML = '';
        appState.mockScenes.forEach((sid, idx) => {
          const s = getScene(sid);
          const active = appState.activeSceneId === sid;
          const graded = sceneStates[sid].graded;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all border flex items-center gap-1.5 ${
            active
              ? 'bg-navy text-white border-navy shadow-sm'
              : 'bg-white text-slate-700 border-indigo-200 hover:bg-indigo-100/70'
          }`;
          btn.innerHTML = `<span>第${idx + 1}問：${escapeHtml(s.tabLabel)}</span>${
            graded ? '<span class="text-emerald-500">✓</span>' : ''
          }`;
          btn.addEventListener('click', () => {
            appState.activeSceneId = sid;
            renderAll();
          });
          el.mockSceneTabs.appendChild(btn);
        });
      } else {
        el.btnMockToggle.className =
          'w-full sm:w-auto px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center justify-center gap-1.5 bg-white text-navy border-navy/30 hover:bg-navy hover:text-white shadow-sm';
        el.mockBtnIcon.textContent = '📝';
        el.mockBtnLabel.textContent = '本番模試モード (ランダム3場面)';
      }
    }

    /**
     * ============================================================
     * ツールバー＆スコアバッジ描画
     * ============================================================
     */
    function renderToolbar() {
      const sceneId = appState.activeSceneId;
      const st = sceneStates[sceneId];

      el.btnToggleAnswers.textContent = st.showAllModels
        ? '模範解答を隠す'
        : '模範解答をすべて表示';

      if (!st.graded) {
        el.scoreBadges.innerHTML = `<span class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-500">未採点</span>`;
      } else {
        const sc = computeSceneScore(sceneId);
        let html = '';
        if (sc.blankTotal > 0) {
          html += `<span class="px-2.5 py-1.5 rounded-lg bg-indigo-50 text-indigo-800 border border-indigo-200">穴埋め ${sc.blankCorrect}/${sc.blankTotal}</span>`;
        }
        if (sc.vocabTotal > 0) {
          html += `<span class="px-2.5 py-1.5 rounded-lg bg-sky-50 text-sky-800 border border-sky-200">単語 ${sc.vocabCorrect}/${sc.vocabTotal}</span>`;
        }
        if (sc.transTotal > 0) {
          html += `<span class="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200">和訳 ○${sc.transOk} △${sc.transClose} / ${sc.transTotal}</span>`;
        }
        el.scoreBadges.innerHTML = html;
      }
    }

    /**
     * ============================================================
     * 左ペイン（スクリプト全文）描画
     * ============================================================
     */
    function renderScriptPane() {
      const scene = getScene(appState.activeSceneId);
      el.scriptTitle.textContent = scene.title;

      let lineNo = 0;
      const frag = document.createDocumentFragment();

      scene.lines.forEach((item) => {
        if (item.type === 'sub') {
          const h = document.createElement('div');
          h.className = 'pt-4 pb-1 first:pt-0 text-xs sm:text-sm font-extrabold text-navy tracking-wide border-b border-slate-200/80 mb-2';
          h.textContent = item.text;
          frag.appendChild(h);
        } else {
          lineNo++;
          const row = document.createElement('div');
          row.className = 'flex items-baseline gap-2.5 py-1 px-2 rounded-lg hover:bg-slate-50/90 transition-colors';
          row.innerHTML = `
            <span class="w-6 text-right text-xs font-mono text-slate-400 select-none shrink-0">${lineNo}.</span>
            <p class="flex-1 text-slate-800 break-words leading-[2.05]">${parseScriptText(item.text, scene.id)}</p>
          `;
          frag.appendChild(row);
        }
      });

      el.scriptPane.innerHTML = '';
      el.scriptPane.appendChild(frag);

      // インライン入力イベントの紐付け
      el.scriptPane.querySelectorAll('.inline-blank-input').forEach((input) => {
        input.addEventListener('input', (e) => {
          const bid = e.target.dataset.blankId;
          sceneStates[scene.id].blanks[bid] = e.target.value;
        });
        input.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') {
            e.preventDefault();
            // 次の空欄へフォーカス移動
            const allInputs = [...el.scriptPane.querySelectorAll('.inline-blank-input')];
            const idx = allInputs.indexOf(e.target);
            if (idx >= 0 && idx + 1 < allInputs.length) {
              allInputs[idx + 1].focus();
            }
          }
        });
      });

      // バッジクリック → 右ペインへジャンプ
      el.scriptPane.querySelectorAll('.jump-to-sheet').forEach((btn) => {
        btn.addEventListener('click', () => {
          jumpToElement(btn.dataset.jumpTarget);
        });
      });
    }

                <span class="font-bold text-slate-900 text-sm sm:text-base">${escapeHtml(item.word)}</span>

                          : 'text-emerald-700 border-emerald-200 hover:bg-emerald-50'
                      }">${isCorrect ? '不正解にする' : '正解にする'}</button>
                    </div>`
                  : ''
              }
            </div>
            <input
              type="text"
              data-vocab-id="${vid}"
              value="${escapeHtml(val)}"
              autocomplete="off"
              placeholder="日本語の意味を入力..."
              class="vocab-input w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500"
            />
            ${
              showModel

          else if (grade === 'ng') cardBorder = 'border-rose-300 bg-rose-50/40';

          const card = document.createElement('div');
          card.id = `card-${tid}`;
          card.className = `rounded-xl border p-3.5 space-y-2.5 transition-all ${cardBorder}`;

                            <button type="button" data-trans-grade="${tid}:close" class="btn-trans-grade px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                              grade === 'close'
                                ? 'bg-amber-500 text-white border-amber-500'
                                : 'bg-white text-amber-800 border-amber-300 hover:bg-amber-50'
                            }">△ 惜しい</button>
                            <button type="button" data-trans-grade="${tid}:ng" class="btn-trans-grade px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                              grade === 'ng'
                                ? 'bg-rose-600 text-white border-rose-600'
                                : 'bg-white text-rose-700 border-rose-300 hover:bg-rose-50'
                            }">× 不正解</button>
                          </div>`
                        : ''
                    }
                  </div>`
                : ''
            }
          `;
          sec.appendChild(card);
        });
        el.answerPane.appendChild(sec);
      }

      // 3. 前置詞・副詞穴埋め まとめ・解説セクション
      if (bKeys.length > 0) {
        const sec = document.createElement('div');
        sec.className = 'space-y-2.5';
        sec.innerHTML = `
          <h3 class="text-sm font-extrabold text-navy flex items-center gap-2 border-b border-slate-200 pb-1.5">
            <span class="px-2 py-0.5 rounded bg-navy text-white text-xs">( )</span>
            前置詞・副詞 穴埋め一覧（${bKeys.length}問）
          </h3>
          <p class="text-[11px] text-slate-500">入力は左の本文中の空欄から行います。採点後に各空欄の解説が表示されます。</p>
        `;

        const listWrap = document.createElement('div');
        listWrap.className = 'space-y-2';

        bKeys.forEach((bid) => {
          const num = bid.slice(1);
          const item = scene.blanks[bid];
          const userVal = (st.blanks[bid] || '').trim();
          const isCorrect =
            st.graded && item.ans.some((a) => a.toLowerCase() === userVal.toLowerCase());
          const showModel = st.graded || st.showAllModels;

          let cardStyle = 'border-slate-200 bg-slate-50/50';
          if (st.graded) {
            cardStyle = isCorrect
              ? 'border-emerald-300 bg-emerald-50/40'
              : 'border-rose-300 bg-rose-50/40';
          }

          const card = document.createElement('div');
          card.id = `card-${bid}`;
          card.className = `rounded-xl border p-3 text-xs space-y-1 transition-all ${cardStyle}`;
          card.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <button type="button" data-jump-target="script-${bid}" class="jump-to-script font-extrabold text-navy hover:underline">空欄 (${num}) を本文で見る</button>
              ${
                st.graded
                  ? `<span class="font-extrabold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">${
                      isCorrect ? '⭕ 正解' : `❌ 入力: ${escapeHtml(userVal || '無回答')}`
                    }</span>`
                  : `<span class="text-slate-400">${userVal ? `入力済: ${escapeHtml(userVal)}` : '未入力'}</span>`
              }
            </div>
            ${
              showModel
                ? `<div class="pt-1 text-slate-700">
                    <span class="font-extrabold text-emerald-700 mr-2">正解: ${escapeHtml(item.ans[0])}</span>
                    <span>${escapeHtml(item.exp)}</span>
                  </div>`
                : ''
            }
          `;
          listWrap.appendChild(card);
        });

        sec.appendChild(listWrap);
        el.answerPane.appendChild(sec);
      }

      // 入力イベント紐付け
      el.answerPane.querySelectorAll('.vocab-input').forEach((input) => {
        input.addEventListener('input', (e) => {
          const vid = e.target.dataset.vocabId;
          st.vocabs[vid] = e.target.value;
        });
        input.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') {
            e.preventDefault();
            const all = [...el.answerPane.querySelectorAll('.vocab-input')];
            const idx = all.indexOf(e.target);
            if (idx >= 0 && idx + 1 < all.length) all[idx + 1].focus();
          }
        });
      });

      el.answerPane.querySelectorAll('.trans-textarea').forEach((ta) => {
        ta.addEventListener('input', (e) => {
          const tid = e.target.dataset.transId;
          st.trans[tid] = e.target.value;
        });
      });

      // 手動単語判定トグル
      el.answerPane.querySelectorAll('.btn-override-vocab').forEach((btn) => {
        btn.addEventListener('click', () => {
          const vid = btn.dataset.overrideVocab;
          const current = getVocabIsCorrect(scene.id, vid);
          st.vocabOverride[vid] = !current;
          renderToolbar();
          renderAnswerPane();
          showToast(!current ? '「正解」に切り替えました' : '「不正解」に切り替えました');
        });
      });

      // 和訳自己採点ボタン
      el.answerPane.querySelectorAll('.btn-trans-grade').forEach((btn) => {
        btn.addEventListener('click', () => {
          const [tid, grade] = btn.dataset.transGrade.split(':');
          st.transGrade[tid] = grade;
          renderToolbar();
          renderAnswerPane();
        });
      });

      // 本文へジャンプボタン
      el.answerPane.querySelectorAll('.jump-to-script').forEach((btn) => {
        btn.addEventListener('click', () => {
          jumpToElement(btn.dataset.jumpTarget);
        });
      });
    }

    /**
     * ============================================================
     * スムーズスクロール＆ハイライト連携
     * ============================================================
     */
    function jumpToElement(targetId) {
      const target = document.getElementById(targetId);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.remove('focus-flash');
      void target.offsetWidth; // reflow
      target.classList.add('focus-flash');

      // 入力欄があればフォーカス
      const input = target.querySelector('input, textarea');
      if (input) {
        setTimeout(() => input.focus({ preventScroll: true }), 250);
      }
    }

    /**
     * ============================================================
     * 採点・リセット・模試モードロジック
     * ============================================================
     */
    function gradeScene(sceneId, silent = false) {
      const scene = getScene(sceneId);
      const st = sceneStates[sceneId];

      // 単語の自動部分一致採点
      Object.keys(scene.vocabs).forEach((vid) => {
        const userVal = (st.vocabs[vid] || '').trim().toLowerCase();
        const keys = scene.vocabs[vid].keys;
        const ok = userVal.length > 0 && keys.some((k) => userVal.includes(k.toLowerCase()));
        st.vocabAuto[vid] = ok;
      });

      st.graded = true;
      if (!silent) {
        renderAll();
        showToast('採点しました！和訳は模範解答を見て自己採点してください。');
      }
    }

    function resetCurrentScene() {
      const sid = appState.activeSceneId;
      sceneStates[sid] = createEmptySceneState();
      renderAll();
      showToast('この場面の入力と採点結果をリセットしました');
    }

    function startMockExam() {
      const pool = ['1', '2', '3', '4', '5'];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const picked = pool.slice(0, 3).sort((a, b) => Number(a) - Number(b));

      // 選ばれた3場面をフレッシュな状態にリセット
      picked.forEach((sid) => {
        sceneStates[sid] = createEmptySceneState();
      });

      appState.mockMode = true;
      appState.mockScenes = picked;
      appState.activeSceneId = picked[0];
      renderAll();
      showToast(`本番模試を開始！（出題：場面${picked.join('・')}）`);
    }

    function openMockSummary() {
      // 3場面すべてを一括採点
      appState.mockScenes.forEach((sid) => gradeScene(sid, true));
      renderAll();

      let sumBlankC = 0, sumBlankT = 0;
      let sumVocabC = 0, sumVocabT = 0;
      let sumTransOk = 0, sumTransClose = 0, sumTransT = 0;

      let breakdownHtml = '';
      appState.mockScenes.forEach((sid, idx) => {
        const s = getScene(sid);
        const sc = computeSceneScore(sid);
        sumBlankC += sc.blankCorrect; sumBlankT += sc.blankTotal;
        sumVocabC += sc.vocabCorrect; sumVocabT += sc.vocabTotal;
        sumTransOk += sc.transOk; sumTransClose += sc.transClose; sumTransT += sc.transTotal;

        breakdownHtml += `
          <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div class="font-bold text-sm text-navy">第${idx + 1}問：${escapeHtml(s.title)}</div>
            <div class="flex flex-wrap gap-1.5 text-xs font-bold">
              <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">穴埋め ${sc.blankCorrect}/${sc.blankTotal}</span>
              <span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800">単語 ${sc.vocabCorrect}/${sc.vocabTotal}</span>
              <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900">和訳 ○${sc.transOk} △${sc.transClose}/${sc.transTotal}</span>
            </div>
          </div>
        `;
      });

      const autoTotal = sumBlankT + sumVocabT;
      const autoCorrect = sumBlankC + sumVocabC;
      const autoRate = autoTotal > 0 ? Math.round((autoCorrect / autoTotal) * 100) : 0;

      el.mockModalBody.innerHTML = `
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="p-3.5 rounded-xl bg-indigo-50 border border-indigo-100">
            <div class="text-[11px] font-bold text-indigo-700">穴埋め合計</div>
            <div class="text-xl font-extrabold text-navy mt-0.5">${sumBlankC} <span class="text-xs text-slate-400">/ ${sumBlankT}</span></div>
          </div>
          <div class="p-3.5 rounded-xl bg-sky-50 border border-sky-100">
            <div class="text-[11px] font-bold text-sky-700">単語合計</div>
            <div class="text-xl font-extrabold text-navy mt-0.5">${sumVocabC} <span class="text-xs text-slate-400">/ ${sumVocabT}</span></div>
          </div>
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-100">
            <div class="text-[11px] font-bold text-amber-800">和訳（自己採点）</div>
            <div class="text-base font-extrabold text-navy mt-1">○${sumTransOk} △${sumTransClose} <span class="text-xs text-slate-400">/ ${sumTransT}</span></div>
          </div>
        </div>
        <div class="text-center py-2 px-4 rounded-xl bg-emerald-50 border border-emerald-200 text-sm font-bold text-emerald-900">
          自動採点パート（穴埋め＋単語）正答率：<span class="text-xl font-extrabold">${autoRate}%</span>（${autoCorrect} / ${autoTotal}問）
        </div>
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-slate-500">各場面の内訳</h3>
          ${breakdownHtml}
        </div>
        <p class="text-xs text-slate-500">※和訳の自己採点がまだの場合は、モーダルを閉じて各場面の「○ / △ / ×」を押してから再度このボタンを押すと反映されます。</p>
      `;

      el.mockModal.classList.remove('hidden');
    }

    function renderAll() {
      renderTabs();
      renderToolbar();
      renderScriptPane();
      renderAnswerPane();
    }

    /**
     * ============================================================
     * 初期化・グローバルイベント
     * ============================================================
     */
    el.btnGrade.addEventListener('click', () => gradeScene(appState.activeSceneId, false));

    el.btnToggleAnswers.addEventListener('click', () => {
      const st = sceneStates[appState.activeSceneId];
      st.showAllModels = !st.showAllModels;
      renderAll();
    });

    el.btnResetScene.addEventListener('click', resetCurrentScene);

    el.btnMockToggle.addEventListener('click', () => {
      if (appState.mockMode) {
        appState.mockMode = false;
        appState.mockScenes = [];
        renderAll();
        showToast('通常モードに戻りました');
      } else {
        startMockExam();
      }
    });

    el.btnMockSummary.addEventListener('click', openMockSummary);
    el.btnCloseModal.addEventListener('click', () => el.mockModal.classList.add('hidden'));
    el.mockModal.addEventListener('click', (e) => {
      if (e.target === el.mockModal) el.mockModal.classList.add('hidden');
    });
    el.btnMockNew.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      startMockExam();
    });
    el.btnMockExit.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      appState.mockMode = false;
      appState.mockScenes = [];
      renderAll();
    });

    // 初回描画
    window.addEventListener('DOMContentLoaded', renderAll);
  </script>
</body>
</html>
