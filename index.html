    /**
     * ============================================================================
     * 2. 問題セット動的生成エンジン（厳密な和訳・単語排他制御付き）
     * ============================================================================
     */
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /**
     * 本文行内で target の開始・終了インデックスを特定する（before/afterヒント対応）
     */
    function findSpanInLine(lineText, target, before = '', after = '') {
      const searchStr = before + target + after;
      const idx = lineText.indexOf(searchStr);
      if (idx !== -1) {
        const start = idx + before.length;
        return { start, end: start + target.length };
      }
      // フォールバック：大文字小文字無視の単純検索
      const lowIdx = lineText.toLowerCase().indexOf(target.toLowerCase());
      if (lowIdx !== -1) {
        return { start: lowIdx, end: lowIdx + target.length };
      }
      return null;
    }

    /**
     * 和訳問題に選ばれた英文群に、ある単語候補の文字列が含まれるかをチェック（二重チェック用）
     */
    function isWordInsideTexts(word, texts) {
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`\\b${escaped}\\b`, 'i');
      return texts.some((txt) => regex.test(txt));
    }

    /**
     * 指定された場面とモード（'A' | 'B' | 'R'）で問題セットを生成する
     * 保証：和訳と単語は lineId レベルかつ文字列レベルで絶対に重複しない
     */
    function generateProblemSet(scene, mode, prevTransKey = '') {
      const cfg = scene.config;

      // (a) 和訳問題を選出
      let selectedTrans = [];
      if (scene.transPool.length > 0 && cfg.transCount > 0) {
        if (mode === 'A' && cfg.presetA.transIds.length > 0) {
          selectedTrans = cfg.presetA.transIds
            .map((id) => scene.transPool.find((t) => t.id === id))
            .filter(Boolean);
        } else if (mode === 'B' && cfg.presetB.transIds.length > 0) {
          selectedTrans = cfg.presetB.transIds
            .map((id) => scene.transPool.find((t) => t.id === id))
            .filter(Boolean);
        } else {
          // ランダム生成：前回と同じ組み合わせにならないよう最大5回試行
          for (let attempt = 0; attempt < 5; attempt++) {
            const shuffled = shuffleArray(scene.transPool);
            const picked = [];
            const usedLineIds = new Set();
            for (const cand of shuffled) {
              if (picked.length >= cfg.transCount) break;
              if (cand.lineIds.some((lid) => usedLineIds.has(lid))) continue;
              picked.push(cand);
              cand.lineIds.forEach((lid) => usedLineIds.add(lid));
            }
            const key = picked.map((t) => t.id).sort().join(',');
            selectedTrans = picked;
            if (key !== prevTransKey) break;
          }
        }
      }
      // 行番号順にソート
      selectedTrans.sort((a, b) => a.lineIds[0] - b.lineIds[0]);

      // 和訳に選ばれた行IDセットと、和訳対象の英文リストを作成
      const transLineIds = new Set();
      const transTexts = [];
      selectedTrans.forEach((t) => {
        t.lineIds.forEach((lid) => {
          transLineIds.add(lid);
          const lineObj = scene.lines.find((l) => l.id === lid);
          if (lineObj) transTexts.push(lineObj.text);
        });
      });

      // (b) 単語問題を選出（厳密な排他制御）
      // 1. 和訳に選ばれた lineId の単語候補を必ず除外
      // 2. 和訳に選ばれた英文中にその単語が含まれる場合も除外（二重チェック）
      const eligibleVocabs = scene.vocabPool.filter((v) => {
        if (transLineIds.has(v.lineId)) return false;
        if (transTexts.length > 0 && isWordInsideTexts(v.target, transTexts)) return false;
        return true;
      });

      let orderedVocabCandidates = [];
      if (mode === 'A') {
        orderedVocabCandidates = [...eligibleVocabs];
      } else if (mode === 'B') {
        orderedVocabCandidates = [...eligibleVocabs].reverse();
      } else {
        orderedVocabCandidates = shuffleArray(eligibleVocabs);
      }

      // 同じ行内で複数単語が選ばれて見づらくならないよう、なるべく異なる行から優先選出
      const selectedVocabs = [];
      const usedVocabLines = new Set();
      const usedVocabTargets = new Set();

      for (const v of orderedVocabCandidates) {
        if (selectedVocabs.length >= cfg.vocabCount) break;
        const lowTarget = v.target.toLowerCase();
        if (usedVocabLines.has(v.lineId) || usedVocabTargets.has(lowTarget)) continue;
        selectedVocabs.push(v);
        usedVocabLines.add(v.lineId);
        usedVocabTargets.add(lowTarget);
      }
      // 目標数に満たなければ、同一行でも位置が被らない別の単語候補を追加
      if (selectedVocabs.length < cfg.vocabCount) {
        for (const v of orderedVocabCandidates) {
          if (selectedVocabs.length >= cfg.vocabCount) break;
          if (selectedVocabs.includes(v)) continue;
          const lowTarget = v.target.toLowerCase();
          if (usedVocabTargets.has(lowTarget)) continue;
          const lineObj = scene.lines.find((l) => l.id === v.lineId);
          if (!lineObj) continue;
          const span = findSpanInLine(lineObj.text, v.target);
          if (!span) continue;
          const overlapsExisting = selectedVocabs.some((ev) => {
            if (ev.lineId !== v.lineId) return false;
            const eSpan = findSpanInLine(lineObj.text, ev.target);
            return eSpan && !(span.end <= eSpan.start || span.start >= eSpan.end);
          });
          if (!overlapsExisting) {
            selectedVocabs.push(v);
            usedVocabTargets.add(lowTarget);
          }
        }
      }
      selectedVocabs.sort((a, b) => a.lineId - b.lineId);

      // (c) 前置詞・副詞穴埋めを選出（単語ハイライトの文字列区間とは絶対に被らせない）
      const eligibleBlanks = scene.blankPool.filter((b) => {
        const lineObj = scene.lines.find((l) => l.id === b.lineId);
        if (!lineObj) return false;
        const bSpan = findSpanInLine(lineObj.text, b.target, b.before || '', b.after || '');
        if (!bSpan) return false;
        // 選ばれた単語候補の区間と重なる前置詞は除外
        const overlapsVocab = selectedVocabs.some((v) => {
          if (v.lineId !== b.lineId) return false;
          const vSpan = findSpanInLine(lineObj.text, v.target);
          return vSpan && !(bSpan.end <= vSpan.start || bSpan.start >= vSpan.end);
        });
        return !overlapsVocab;
      });

      let orderedBlankCandidates = [];
      if (mode === 'A') orderedBlankCandidates = [...eligibleBlanks];
      else if (mode === 'B') orderedBlankCandidates = [...eligibleBlanks].reverse();
      else orderedBlankCandidates = shuffleArray(eligibleBlanks);

      const selectedBlanks = orderedBlankCandidates
        .slice(0, cfg.blankCount)
        .sort((a, b) => {
          if (a.lineId !== b.lineId) return a.lineId - b.lineId;
          const lineObj = scene.lines.find((l) => l.id === a.lineId);
          const sa = findSpanInLine(lineObj.text, a.target, a.before || '', a.after || '');
          const sb = findSpanInLine(lineObj.text, b.target, b.before || '', b.after || '');
          return (sa ? sa.start : 0) - (sb ? sb.start : 0);
        });

      // (d) 最終バリデーション：和訳と単語の重複がないことを保証
      const overlapDetected = selectedVocabs.some(
        (v) => transLineIds.has(v.lineId) || (transTexts.length > 0 && isWordInsideTexts(v.target, transTexts))
      );

      // 表示用の連番ID（T1, V1, B1...）を付与
      const transMap = {};
      selectedTrans.forEach((t, idx) => {
        transMap[`T${idx + 1}`] = { ...t, num: idx + 1, qid: `T${idx + 1}` };
      });
      const vocabMap = {};
      selectedVocabs.forEach((v, idx) => {
        vocabMap[`V${idx + 1}`] = { ...v, num: idx + 1, qid: `V${idx + 1}` };
      });
      const blankMap = {};
      selectedBlanks.forEach((b, idx) => {
        blankMap[`B${idx + 1}`] = { ...b, num: idx + 1, qid: `B${idx + 1}` };
      });

      return {
        mode,
        transKey: selectedTrans.map((t) => t.id).sort().join(','),
        trans: transMap,
        vocabs: vocabMap,
        blanks: blankMap,
        noOverlapVerified: !overlapDetected
      };
    }

    /**
     * ============================================================================
     * 3. アプリケーション状態管理
     * ============================================================================
     */
    const sceneStates = {};

    function initSceneState(sceneId, mode = 'A') {
      const scene = getScene(sceneId);
      const prevKey = sceneStates[sceneId]?.problemSet?.transKey || '';
      const problemSet = generateProblemSet(scene, mode, prevKey);
      sceneStates[sceneId] = {
        mode,
        problemSet,
        blanks: {},
        vocabs: {},
        vocabAuto: {},
        vocabOverride: {},
        trans: {},
        transGrade: {},
        graded: false,
        showAllModels: false
      };
    }

    const appState = {
      activeSceneId: '1',
      mockMode: false,
      mockScenes: []
    };

    function getScene(id) {
      return SCENES.find((s) => s.id === id) || SCENES[0];
    }

    // 全場面をパターンAで初期化
    SCENES.forEach((s) => initSceneState(s.id, 'A'));

      el.toast.classList.remove('hidden');

      toastTimer = setTimeout(() => el.toast.classList.add('hidden'), 2300);

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * ============================================================================
     * 5. 本文レンダリング（選択された問題セットをプレーンテキストへ安全に差し込み）
     * ============================================================================
     */
    function renderLineWithProblems(lineObj, sceneId) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;
      const text = lineObj.text;

      // この行に属する和訳問題（あれば1つ）
      const transItem = Object.values(ps.trans).find((t) => t.lineIds.includes(lineObj.id));
      const isFirstLineOfTrans = transItem && transItem.lineIds[0] === lineObj.id;

      // この行に属する単語問題・前置詞問題の区間を収集
      const tokens = [];

      Object.values(ps.vocabs).forEach((v) => {
        if (v.lineId !== lineObj.id) return;
        const span = findSpanInLine(text, v.target);
        if (span) {
          tokens.push({ type: 'vocab', start: span.start, end: span.end, item: v });
        }
      });

      Object.values(ps.blanks).forEach((b) => {
        if (b.lineId !== lineObj.id) return;
        const span = findSpanInLine(text, b.target, b.before || '', b.after || '');
        if (span) {
          tokens.push({ type: 'blank', start: span.start, end: span.end, item: b });
        }
      });

      // 開始位置でソートし、万が一重なる区間があればスキップ
      tokens.sort((a, b) => a.start - b.start);
      const safeTokens = [];
      let lastEnd = 0;
      for (const tk of tokens) {
        if (tk.start >= lastEnd) {
          safeTokens.push(tk);
          lastEnd = tk.end;
        }
      }

      // テキストを組み立て
      let innerHtml = '';
      let cursor = 0;
      for (const tk of safeTokens) {
        if (tk.start > cursor) {
          innerHtml += escapeHtml(text.slice(cursor, tk.start));
        }

        if (tk.type === 'vocab') {
          const v = tk.item;
          const rawWord = text.slice(tk.start, tk.end);
          innerHtml += `<span id="script-${v.qid}" class="vocab-span"><button type="button" data-jump-target="card-${v.qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1 rounded text-[11px] font-extrabold bg-sky-600 hover:bg-sky-700 text-white align-middle cursor-pointer transition-colors">単${v.num}</button>${escapeHtml(rawWord)}</span>`;
        } else if (tk.type === 'blank') {
          const b = tk.item;
          const savedVal = st.blanks[b.qid] || '';
          const isCorrect =
            st.graded && b.ans.some((a) => a.toLowerCase() === savedVal.trim().toLowerCase());

          let inputColor = 'border-slate-300 bg-white text-slate-900 focus:border-indigo-500 focus:ring-indigo-500/20';
          if (st.graded) {
            inputColor = isCorrect
              ? 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold'
              : 'border-rose-500 bg-rose-50 text-rose-900 font-bold';
          }
          const showCorrection = (st.graded && !isCorrect) || st.showAllModels;

          innerHtml += `<span id="script-${b.qid}" class="inline-flex items-center gap-1 mx-0.5 align-baseline"><button type="button" data-jump-target="card-${b.qid}" class="jump-to-sheet text-[11px] font-extrabold text-slate-500 hover:text-indigo-700">(${b.num})</button><input type="text" data-blank-id="${b.qid}" value="${escapeHtml(savedVal)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="..." class="inline-blank-input w-20 sm:w-24 px-2 py-0.5 text-sm sm:text-[15px] rounded-lg border-2 focus:outline-none focus:ring-2 transition-colors ${inputColor}" />${
            showCorrection
              ? `<span class="text-xs font-extrabold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">${escapeHtml(b.ans[0])}</span>`
              : ''
          }</span>`;
        }

        cursor = tk.end;
      }
      if (cursor < text.length) {
        innerHtml += escapeHtml(text.slice(cursor));
      }

      // 和訳問題の対象行なら全体を和訳下線でラップ
      if (transItem) {
        const badge = isFirstLineOfTrans
          ? `<button type="button" data-jump-target="card-${transItem.qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1.5 rounded text-[11px] font-extrabold bg-amber-500 hover:bg-amber-600 text-white align-middle cursor-pointer transition-colors">訳${transItem.num}</button>`
          : `<span class="inline-flex items-center px-1 py-0.5 mr-1 rounded text-[10px] font-bold bg-amber-200 text-amber-900 align-middle">訳${transItem.num}続</span>`;
        return `<span id="${isFirstLineOfTrans ? `script-${transItem.qid}` : ''}" class="trans-span">${badge}${innerHtml}</span>`;
      }

      return innerHtml;
    }

    /**
     * ============================================================================
     * 6. スコア集計
     * ============================================================================
     */
    function getVocabIsCorrect(sceneId, vid) {
      const st = sceneStates[sceneId];
      if (typeof st.vocabOverride[vid] === 'boolean') return st.vocabOverride[vid];
      return Boolean(st.vocabAuto[vid]);
    }

    function computeSceneScore(sceneId) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;

      const bKeys = Object.keys(ps.blanks);
      let blankCorrect = 0;
      bKeys.forEach((k) => {
        const val = (st.blanks[k] || '').trim().toLowerCase();
        if (ps.blanks[k].ans.some((a) => a.toLowerCase() === val)) blankCorrect++;
      });

      const vKeys = Object.keys(ps.vocabs);
      let vocabCorrect = 0;
      vKeys.forEach((k) => {
        if (getVocabIsCorrect(sceneId, k)) vocabCorrect++;
      });

      const tKeys = Object.keys(ps.trans);
      let transOk = 0;
      let transClose = 0;
      tKeys.forEach((k) => {
        if (st.transGrade[k] === 'ok') transOk++;
        if (st.transGrade[k] === 'close') transClose++;
      });

      return {
        blankCorrect,
        blankTotal: bKeys.length,
        vocabCorrect,
        vocabTotal: vKeys.length,
        transOk,
        transClose,
        transTotal: tKeys.length
      };
    }

    function jumpToElement(targetId) {
      const target = document.getElementById(targetId);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.remove('focus-flash');
      void target.offsetWidth;
      target.classList.add('focus-flash');
      const input = target.querySelector('input, textarea');
      if (input) setTimeout(() => input.focus({ preventScroll: true }), 250);
    }

    /**
     * ============================================================================
     * 8. アクション（採点・バリエーション切替・リセット・本番模試）
     * ============================================================================
     */
    function switchVariation(mode) {
      const sid = appState.activeSceneId;
      initSceneState(sid, mode);
      renderAll();
      const label = mode === 'A' ? 'パターンA' : mode === 'B' ? 'パターンB' : 'ランダム問題';
      showToast(`${label}を生成しました（和訳・単語の重複なし ✓）`);
    }

    function gradeScene(sceneId, silent = false) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;

      Object.keys(ps.vocabs).forEach((vid) => {
        const userVal = (st.vocabs[vid] || '').trim().toLowerCase();
        const keys = ps.vocabs[vid].keys;
        st.vocabAuto[vid] = userVal.length > 0 && keys.some((k) => userVal.includes(k.toLowerCase()));
      });

      st.graded = true;
      if (!silent) {
        renderAll();
        showToast('採点しました！和訳は模範解答を見て自己採点してください。');
      }
    }

    function resetCurrentScene() {
      const sid = appState.activeSceneId;
      const st = sceneStates[sid];
      st.blanks = {};
      st.vocabs = {};
      st.vocabAuto = {};
      st.vocabOverride = {};
      st.trans = {};
      st.transGrade = {};
      st.graded = false;
      st.showAllModels = false;
      renderAll();
      showToast('現在の問題の入力と採点結果をリセットしました');
    }

    function startMockExam() {
      const picked = shuffleArray(['1', '2', '3', '4', '5'])
        .slice(0, 3)
        .sort((a, b) => Number(a) - Number(b));

      // 選ばれた3場面をすべてランダムバリエーションで新規生成
      picked.forEach((sid) => initSceneState(sid, 'R'));

      appState.mockMode = true;
      appState.mockScenes = picked;
      appState.activeSceneId = picked[0];
      renderAll();
      showToast(`本番模試を開始！（ランダム出題：場面${picked.join('・')}）`);
    }

    function openMockSummary() {
      appState.mockScenes.forEach((sid) => gradeScene(sid, true));
      renderAll();

      let sumBlankC = 0, sumBlankT = 0;
      let sumVocabC = 0, sumVocabT = 0;
      let sumTransOk = 0, sumTransClose = 0, sumTransT = 0;
      let breakdownHtml = '';

      appState.mockScenes.forEach((sid, idx) => {
        const s = getScene(sid);
        const sc = computeSceneScore(sid);
        sumBlankC += sc.blankCorrect; sumBlankT += sc.blankTotal;
        sumVocabC += sc.vocabCorrect; sumVocabT += sc.vocabTotal;
        sumTransOk += sc.transOk; sumTransClose += sc.transClose; sumTransT += sc.transTotal;

        breakdownHtml += `
          <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div class="font-bold text-sm text-slate-900">第${idx + 1}問：${escapeHtml(s.title)}</div>
            <div class="flex flex-wrap gap-1.5 text-xs font-bold">
              <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">前置詞 ${sc.blankCorrect}/${sc.blankTotal}</span>
              <span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800">単語 ${sc.vocabCorrect}/${sc.vocabTotal}</span>
              <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900">和訳 ○${sc.transOk} △${sc.transClose}/${sc.transTotal}</span>
            </div>
          </div>
        `;
      });

      const autoTotal = sumBlankT + sumVocabT;
      const autoCorrect = sumBlankC + sumVocabC;
      const autoRate = autoTotal > 0 ? Math.round((autoCorrect / autoTotal) * 100) : 0;

      el.mockModalBody.innerHTML = `
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="p-3.5 rounded-xl bg-indigo-50 border border-indigo-100">
            <div class="text-[11px] font-bold text-indigo-700">前置詞合計</div>
            <div class="text-xl font-extrabold text-slate-900 mt-0.5">${sumBlankC} <span class="text-xs text-slate-400">/ ${sumBlankT}</span></div>
          </div>
          <div class="p-3.5 rounded-xl bg-sky-50 border border-sky-100">
            <div class="text-[11px] font-bold text-sky-700">単語合計</div>
            <div class="text-xl font-extrabold text-slate-900 mt-0.5">${sumVocabC} <span class="text-xs text-slate-400">/ ${sumVocabT}</span></div>
          </div>
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-100">
            <div class="text-[11px] font-bold text-amber-800">和訳（自己採点）</div>
            <div class="text-base font-extrabold text-slate-900 mt-1">○${sumTransOk} △${sumTransClose} <span class="text-xs text-slate-400">/ ${sumTransT}</span></div>
          </div>
        </div>
        <div class="text-center py-2.5 px-4 rounded-xl bg-emerald-50 border border-emerald-200 text-sm font-bold text-emerald-900">
          自動採点パート（前置詞＋単語）正答率：<span class="text-xl font-extrabold">${autoRate}%</span>（${autoCorrect} / ${autoTotal}問）
        </div>
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-slate-500">各場面の内訳</h3>
          ${breakdownHtml}
        </div>
        <p class="text-xs text-slate-500">※和訳の自己採点がまだの場合は、モーダルを閉じて各場面の「○ / △ / ×」を選んでから再度このボタンを押すと反映されます。</p>
      `;

      el.mockModal.classList.remove('hidden');
    }

    function renderAll() {
      renderTabs();
      renderToolbar();
      renderScriptPane();
      renderAnswerPane();
    }

    /**
     * ============================================================================
     * 9. イベントリスナー登録
     * ============================================================================
     */
    el.btnVarA.addEventListener('click', () => switchVariation('A'));
    el.btnVarB.addEventListener('click', () => switchVariation('B'));
    el.btnVarR.addEventListener('click', () => switchVariation('R'));

    el.btnGrade.addEventListener('click', () => gradeScene(appState.activeSceneId, false));
    el.btnToggleAnswers.addEventListener('click', () => {
      const st = sceneStates[appState.activeSceneId];
      st.showAllModels = !st.showAllModels;
      renderAll();
    });
    el.btnResetScene.addEventListener('click', resetCurrentScene);

    el.btnMockToggle.addEventListener('click', () => {
      if (appState.mockMode) {
        appState.mockMode = false;
        appState.mockScenes = [];
        renderAll();
        showToast('通常モードに戻りました');
      } else {
        startMockExam();
      }
    });

    el.btnMockSummary.addEventListener('click', openMockSummary);
    el.btnCloseModal.addEventListener('click', () => el.mockModal.classList.add('hidden'));
    el.mockModal.addEventListener('click', (e) => {
      if (e.target === el.mockModal) el.mockModal.classList.add('hidden');
    });
    el.btnMockNew.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      startMockExam();
    });
    el.btnMockExit.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      appState.mockMode = false;
      appState.mockScenes = [];
      renderAll();
    });

    window.addEventListener('DOMContentLoaded', renderAll);
  </script>
</body>
</html>
