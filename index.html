      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 1rem;
      align-items: start;
    }
    .answer-panel-sticky {
      position: sticky;
      top: 124px;
      max-height: calc(100vh - 140px);

    @media (max-width: 900px) {
      .exam-workspace {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .answer-panel-sticky {
        position: static;
        max-height: none;

      width: 6px;
      height: 6px;

      background: transparent;
    }

      background: #cbd5e1;
      border-radius: 9999px;
    }

      background: #94a3b8;
    }

    /* 双方向ジャンプ時のフォーカス演出 */

      70% { box-shadow: 0 0 0 8px rgba(79, 70, 229, 0); }

    /**
     * ============================================================================
     * 2. 厳密3方向排他制御エンジン（前置詞・和訳・単語の重複ゼロを保証）
     * ============================================================================
     */
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /**
     * 本文行内で target の開始・終了位置を取得
     */
    function findSpanInLine(lineText, target, before = '', after = '') {
      const searchStr = before + target + after;
      const idx = lineText.indexOf(searchStr);
      if (idx !== -1) {
        const start = idx + before.length;
        return { start, end: start + target.length };
      }
      const lowIdx = lineText.toLowerCase().indexOf(target.toLowerCase());
      if (lowIdx !== -1) {
        return { start: lowIdx, end: lowIdx + target.length };
      }
      return null;
    }

    /**
     * 単語候補の文字列が、選出済み和訳文の中に含まれていないか二重チェック
     */
    function isWordInsideTexts(word, texts) {
      if (!texts.length) return false;
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`\\b${escaped}\\b`, 'i');
      return texts.some((txt) => regex.test(txt));
    }

    /**
     * 3方向排他制御つき問題セット生成
     * (a) 和訳を選出 -> transLineIds を予約
     * (b) 前置詞を transLineIds 以外の行から選出 -> blankLineIds を予約（1行につき最大1問）
     * (c) 単語を transLineIds かつ blankLineIds 以外の行から選出（さらに和訳文中の語も除外）
     */
    function generateProblemSet(scene, mode, prevSignature = '') {
      const cfg = scene.config;

      // (a) 和訳問題を選出
      let selectedTrans = [];
      if (scene.transPool.length > 0 && cfg.transCount > 0) {
        if (mode === 'A' && cfg.presetA.transIds.length > 0) {
          selectedTrans = cfg.presetA.transIds
            .map((id) => scene.transPool.find((t) => t.id === id))
            .filter(Boolean);
        } else if (mode === 'B' && cfg.presetB.transIds.length > 0) {
          selectedTrans = cfg.presetB.transIds
            .map((id) => scene.transPool.find((t) => t.id === id))
            .filter(Boolean);
        } else {
          for (let attempt = 0; attempt < 6; attempt++) {
            const shuffled = shuffleArray(scene.transPool);
            const picked = [];
            const used = new Set();
            for (const cand of shuffled) {
              if (picked.length >= cfg.transCount) break;
              if (cand.lineIds.some((lid) => used.has(lid))) continue;
              picked.push(cand);
              cand.lineIds.forEach((lid) => used.add(lid));
            }
            const sig = picked.map((t) => t.id).sort().join(',');
            selectedTrans = picked;
            if (sig !== prevSignature) break;
          }
        }
      }
      selectedTrans.sort((a, b) => a.lineIds[0] - b.lineIds[0]);

      const transLineIds = new Set();
      const transTexts = [];
      selectedTrans.forEach((t) => {
        t.lineIds.forEach((lid) => {
          transLineIds.add(lid);
          const lineObj = scene.lines.find((l) => l.id === lid);
          if (lineObj) transTexts.push(lineObj.text);
        });
      });

      // (b) 前置詞・副詞穴埋めを選出（和訳行を厳密に除外、1行1問まで）
      const eligibleBlanks = scene.blankPool.filter((b) => !transLineIds.has(b.lineId));
      let orderedBlanks = [];
      if (mode === 'A') orderedBlanks = [...eligibleBlanks];
      else if (mode === 'B') orderedBlanks = [...eligibleBlanks].reverse();
      else orderedBlanks = shuffleArray(eligibleBlanks);

      const selectedBlanks = [];
      const blankLineIds = new Set();
      for (const b of orderedBlanks) {
        if (selectedBlanks.length >= cfg.blankCount) break;
        if (blankLineIds.has(b.lineId)) continue;
        selectedBlanks.push(b);
        blankLineIds.add(b.lineId);
      }
      selectedBlanks.sort((a, b) => a.lineId - b.lineId);

      // (c) 単語問題を選出（和訳行・前置詞行を厳密に除外＋和訳文内文字列の二重チェック）
      const eligibleVocabs = scene.vocabPool.filter((v) => {
        if (transLineIds.has(v.lineId)) return false;
        if (blankLineIds.has(v.lineId)) return false;
        if (isWordInsideTexts(v.target, transTexts)) return false;
        return true;
      });

      let orderedVocabs = [];
      if (mode === 'A') orderedVocabs = [...eligibleVocabs];
      else if (mode === 'B') orderedVocabs = [...eligibleVocabs].reverse();
      else orderedVocabs = shuffleArray(eligibleVocabs);

      const selectedVocabs = [];
      const vocabLineIds = new Set();
      const usedTargets = new Set();
      for (const v of orderedVocabs) {
        if (selectedVocabs.length >= cfg.vocabCount) break;
        const low = v.target.toLowerCase();
        if (vocabLineIds.has(v.lineId) || usedTargets.has(low)) continue;
        selectedVocabs.push(v);
        vocabLineIds.add(v.lineId);
        usedTargets.add(low);
      }
      selectedVocabs.sort((a, b) => a.lineId - b.lineId);

      // (d) 最終3方向重複検証（1行に2種類以上が存在しないことを確認）
      let hasOverlap = false;
      for (const lid of blankLineIds) {
        if (transLineIds.has(lid) || vocabLineIds.has(lid)) hasOverlap = true;
      }
      for (const lid of vocabLineIds) {
        if (transLineIds.has(lid) || blankLineIds.has(lid)) hasOverlap = true;
      }
      if (selectedVocabs.some((v) => isWordInsideTexts(v.target, transTexts))) {
        hasOverlap = true;
      }

      // 連番マップ作成
      const transMap = {};
      selectedTrans.forEach((t, idx) => {
        transMap[`T${idx + 1}`] = { ...t, num: idx + 1, qid: `T${idx + 1}` };
      });
      const blankMap = {};
      selectedBlanks.forEach((b, idx) => {
        blankMap[`B${idx + 1}`] = { ...b, num: idx + 1, qid: `B${idx + 1}` };
      });
      const vocabMap = {};
      selectedVocabs.forEach((v, idx) => {
        vocabMap[`V${idx + 1}`] = { ...v, num: idx + 1, qid: `V${idx + 1}` };
      });

      return {
        mode,
        signature: selectedTrans.map((t) => t.id).sort().join(','),
        trans: transMap,
        blanks: blankMap,
        vocabs: vocabMap,
        strictlyNonOverlapping: !hasOverlap
      };
    }

    /**
     * ============================================================================
     * 3. 状態管理
     * ============================================================================
     */
    const sceneStates = {};

      return SCENES.find((s) => s.id === id) || SCENES[0];

      const prevSig = sceneStates[sceneId]?.problemSet?.signature || '';

        mode,

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * ============================================================================
     * 5. 本文行のレンダリング（1行につき最大1種類の問題）
     * ============================================================================
     */
    function renderLineWithProblems(lineObj, sceneId) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;
      const text = lineObj.text;

      // 1) 和訳問題の行
      const transItem = Object.values(ps.trans).find((t) => t.lineIds.includes(lineObj.id));
      if (transItem) {
        const isFirst = transItem.lineIds[0] === lineObj.id;
        const isOpen = Boolean(st.showInlineTrans || st.showAllModels || st.inlineTransOpen[transItem.qid]);
        const badge = isFirst
          ? `<button type="button" data-jump-target="card-${transItem.qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1.5 rounded text-[11px] font-extrabold bg-amber-500 hover:bg-amber-600 text-white align-middle cursor-pointer transition-colors">訳${transItem.num}</button>`
          : `<span class="inline-flex items-center px-1 py-0.5 mr-1 rounded text-[10px] font-bold bg-amber-200 text-amber-900 align-middle">訳${transItem.num}続</span>`;
        const perLineToggle = isFirst
          ? `<button type="button" data-toggle-inline-tid="${transItem.qid}" class="btn-perline-trans inline-flex items-center px-2 py-0.5 ml-1.5 rounded text-[10px] font-bold border align-middle transition-colors ${
              isOpen
                ? 'bg-amber-100 text-amber-900 border-amber-300 hover:bg-amber-200'
                : 'bg-white text-amber-800 border-amber-300 hover:bg-amber-50'
            }">${isOpen ? '解答を隠す' : '解答を見る'}</button>`
          : '';
        return `<span id="${isFirst ? `script-${transItem.qid}` : ''}" class="trans-span">${badge}${escapeHtml(text)}</span>${perLineToggle}`;
      }

      // 2) 前置詞・副詞穴埋めの行
      const blankItem = Object.values(ps.blanks).find((b) => b.lineId === lineObj.id);
      if (blankItem) {
        const span = findSpanInLine(text, blankItem.target, blankItem.before || '', blankItem.after || '');
        if (span) {
          const savedVal = st.blanks[blankItem.qid] || '';
          const isCorrect =
            st.graded && blankItem.ans.some((a) => a.toLowerCase() === savedVal.trim().toLowerCase());

          let inputStyle = 'border-indigo-300 bg-white text-slate-900 focus:border-indigo-600 focus:ring-indigo-500/20';
          if (st.graded) {
            inputStyle = isCorrect
              ? 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold'
              : 'border-rose-500 bg-rose-50 text-rose-900 font-bold';
          }
          const showCorrection = (st.graded && !isCorrect) || st.showAllModels;

          return `${escapeHtml(text.slice(0, span.start))}<span id="script-${blankItem.qid}" class="inline-flex items-center gap-1 mx-0.5 align-baseline"><button type="button" data-jump-target="card-${blankItem.qid}" class="jump-to-sheet px-1.5 py-0.5 rounded text-[11px] font-extrabold bg-indigo-600 hover:bg-indigo-700 text-white transition-colors">(${blankItem.num})</button><input type="text" data-blank-id="${blankItem.qid}" value="${escapeHtml(savedVal)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="..." class="inline-blank-input w-20 sm:w-24 px-2 py-0.5 text-sm sm:text-[15px] rounded-lg border-2 focus:outline-none focus:ring-2 transition-colors ${inputStyle}" />${
            showCorrection
              ? `<span class="text-xs font-extrabold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-800 border border-indigo-200">${escapeHtml(blankItem.ans[0])}</span>`
              : ''
          }</span>${escapeHtml(text.slice(span.end))}`;
        }
      }

      // 3) 単語問題の行
      const vocabItem = Object.values(ps.vocabs).find((v) => v.lineId === lineObj.id);
      if (vocabItem) {
        const span = findSpanInLine(text, vocabItem.target);
        if (span) {
          const rawWord = text.slice(span.start, span.end);
          return `${escapeHtml(text.slice(0, span.start))}<span id="script-${vocabItem.qid}" class="vocab-span"><button type="button" data-jump-target="card-${vocabItem.qid}" class="jump-to-sheet inline-flex items-center px-1.5 py-0.5 mr-1 rounded text-[11px] font-extrabold bg-teal-600 hover:bg-teal-700 text-white align-middle cursor-pointer transition-colors">単${vocabItem.num}</button>${escapeHtml(rawWord)}</span>${escapeHtml(text.slice(span.end))}`;
        }
      }

      // 通常行
      return escapeHtml(text);
    }

    /**
     * ============================================================================
     * 6. スコア集計
     * ============================================================================
     */
    function getVocabIsCorrect(sceneId, vid) {
      const st = sceneStates[sceneId];
      if (typeof st.vocabOverride[vid] === 'boolean') return st.vocabOverride[vid];
      return Boolean(st.vocabAuto[vid]);
    }

    function computeSceneScore(sceneId) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;

      const bKeys = Object.keys(ps.blanks);
      let blankCorrect = 0;
      bKeys.forEach((k) => {
        const val = (st.blanks[k] || '').trim().toLowerCase();
        if (ps.blanks[k].ans.some((a) => a.toLowerCase() === val)) blankCorrect++;
      });

      const vKeys = Object.keys(ps.vocabs);
      let vocabCorrect = 0;
      vKeys.forEach((k) => {
        if (getVocabIsCorrect(sceneId, k)) vocabCorrect++;
      });

      const tKeys = Object.keys(ps.trans);
      let transOk = 0;
      let transClose = 0;
      tKeys.forEach((k) => {
        if (st.transGrade[k] === 'ok') transOk++;
        if (st.transGrade[k] === 'close') transClose++;
      });

      return {
        blankCorrect,
        blankTotal: bKeys.length,
        vocabCorrect,
        vocabTotal: vKeys.length,
        transOk,
        transClose,
        transTotal: tKeys.length
      };
    }

    /**

            active
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
              : 'bg-white text-slate-700 border-indigo-200 hover:bg-indigo-100/70'
          }`;
          btn.innerHTML = `<span>第${idx + 1}問：${escapeHtml(s.tabLabel)}</span>${
            graded ? '<span class="text-emerald-400">✓</span>' : ''
          }`;

            appState.activeSceneId = sid;
            renderAll();
          });
          el.mockSceneTabs.appendChild(btn);
        });
      } else {
        el.btnMockToggle.className =
          'w-full sm:w-auto px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center justify-center gap-1.5 bg-white text-indigo-700 border-indigo-300 hover:bg-indigo-600 hover:text-white shadow-sm';
        el.mockBtnIcon.textContent = '📝';
        el.mockBtnLabel.textContent = '本番模試モード (ランダム3場面)';
      }
    }

    function renderToolbar() {
      const scene = getScene(appState.activeSceneId);
      const st = sceneStates[scene.id];
      const ps = st.problemSet;

      const activeClass = 'bg-indigo-600 text-white border-indigo-600 shadow-sm';
      const inactiveClass = 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300 hover:text-indigo-700';

      el.btnVarA.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border transition-all ${st.mode === 'A' ? activeClass : inactiveClass}`;
      el.btnVarB.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border transition-all ${st.mode === 'B' ? activeClass : inactiveClass}`;
      el.btnVarR.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-1 ${

          出題：前置詞${bCount} / 和訳${tCount} / 単語${vCount}
        </span>

          html += `<span class="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-900 border border-amber-200">和訳 ○${sc.transOk} △${sc.transClose}/${sc.transTotal}</span>`;
        }
        el.scoreBadges.innerHTML = html;
      }
    }

    function renderScriptPane() {

          if (currentlyOpen) {
            if (st.showInlineTrans || st.showAllModels) {
              Object.keys(ps.trans).forEach((k) => {
                st.inlineTransOpen[k] = k !== tid;
              });
              st.showInlineTrans = false;
              st.showAllModels = false;
            } else {
              st.inlineTransOpen[tid] = false;
            }
          } else {
            st.inlineTransOpen[tid] = true;
          }
          renderToolbar();
          renderScriptPane();
        });
      });

      // 本文バッジ → 解答用紙ジャンプ
      el.scriptPane.querySelectorAll('.jump-to-sheet').forEach((btn) => {
        btn.addEventListener('click', () => jumpToElement(btn.dataset.jumpTarget));
      });
    }

    function renderAnswerPane() {
      const scene = getScene(appState.activeSceneId);
      const st = sceneStates[scene.id];
      const ps = st.problemSet;

      const tKeys = Object.keys(ps.trans);
      const vKeys = Object.keys(ps.vocabs);
      const bKeys = Object.keys(ps.blanks);

      el.sheetCounts.textContent = `和訳${tKeys.length}・単語${vKeys.length}・前置詞${bKeys.length}`;
      el.answerPane.innerHTML = '';

      // 1. 和訳問題セクション（アンバー系）
      if (tKeys.length > 0) {
        const sec = document.createElement('div');
        sec.className = 'space-y-3';
        sec.innerHTML = `
          <h3 class="text-sm font-extrabold text-amber-900 flex items-center gap-2 border-b border-amber-100 pb-1.5">
            <span class="px-2 py-0.5 rounded bg-amber-500 text-white text-xs">訳</span>
            和訳問題（${tKeys.length}問）
          </h3>
        `;

        tKeys.forEach((tid) => {
          const item = ps.trans[tid];
          const val = st.trans[tid] || '';
          const grade = st.transGrade[tid] || null;
          const showModel = st.graded || st.showAllModels;

          let cardBorder = 'border-slate-200 bg-slate-50/50';
          if (grade === 'ok') cardBorder = 'border-emerald-300 bg-emerald-50/40';
          else if (grade === 'close') cardBorder = 'border-amber-300 bg-amber-50/40';
          else if (grade === 'ng') cardBorder = 'border-rose-300 bg-rose-50/40';

          const card = document.createElement('div');
          card.id = `card-${tid}`;
          card.className = `rounded-xl border p-3.5 space-y-2.5 transition-all ${cardBorder}`;
          card.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button type="button" data-jump-target="script-${tid}" class="jump-to-script px-2 py-0.5 rounded text-xs font-extrabold bg-amber-500 hover:bg-amber-600 text-white transition-colors">訳${item.num}（本文へ）</button>
                <span class="text-[11px] font-semibold text-slate-400">行 ${item.lineIds.join(', ')}</span>
              </div>
              ${
                grade
                  ? `<span class="text-xs font-extrabold ${
                      grade === 'ok' ? 'text-emerald-700' : grade === 'close' ? 'text-amber-700' : 'text-rose-600'
                    }">${grade === 'ok' ? '○ 正解' : grade === 'close' ? '△ 部分点' : '× 不正解'}</span>`
                  : ''
              }
            </div>
            <textarea
              rows="2"
              data-trans-id="${tid}"
              placeholder="ここに和訳を入力..."
              class="trans-textarea w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500 resize-y"
            >${escapeHtml(val)}</textarea>
            ${
              showModel
                ? `<div class="text-xs bg-white rounded-lg p-3 border border-amber-200/80 space-y-1.5">
                    <p><span class="font-bold text-emerald-700">模範解答：</span><span class="font-bold text-slate-900">${escapeHtml(item.ans)}</span></p>
                    <p class="text-slate-600"><span class="font-bold text-amber-800">ポイント：</span>${escapeHtml(item.exp)}</p>
                    ${
                      st.graded
                        ? `<div class="pt-1.5 flex items-center gap-1.5 flex-wrap">
                            <span class="text-[11px] font-bold text-slate-500 mr-1">自己採点：</span>
                            <button type="button" data-trans-grade="${tid}:ok" class="btn-trans-grade px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                              grade === 'ok' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'
                            }">○ 正解</button>
                            <button type="button" data-trans-grade="${tid}:close" class="btn-trans-grade px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                              grade === 'close' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-800 border-amber-300 hover:bg-amber-50'
                            }">△ 部分点</button>
                            <button type="button" data-trans-grade="${tid}:ng" class="btn-trans-grade px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${
                              grade === 'ng' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-rose-700 border-rose-300 hover:bg-rose-50'
                            }">× 不正解</button>
                          </div>`
                        : ''
                    }
                  </div>`
                : ''
            }
          `;
          sec.appendChild(card);
        });
        el.answerPane.appendChild(sec);
      }

      // 2. 単語・表現問題セクション（ティール系）
      if (vKeys.length > 0) {
        const sec = document.createElement('div');
        sec.className = 'space-y-3';
        sec.innerHTML = `
          <h3 class="text-sm font-extrabold text-teal-900 flex items-center gap-2 border-b border-teal-100 pb-1.5">
            <span class="px-2 py-0.5 rounded bg-teal-600 text-white text-xs">単</span>
            単語・表現問題（${vKeys.length}問）
          </h3>
        `;

        vKeys.forEach((vid) => {
          const item = ps.vocabs[vid];
          const val = st.vocabs[vid] || '';
          const isCorrect = getVocabIsCorrect(scene.id, vid);
          const showModel = st.graded || st.showAllModels;

          let cardBorder = 'border-slate-200 bg-slate-50/50';
          if (st.graded) {
            cardBorder = isCorrect ? 'border-emerald-300 bg-emerald-50/40' : 'border-rose-300 bg-rose-50/40';
          }

          const card = document.createElement('div');
          card.id = `card-${vid}`;
          card.className = `rounded-xl border p-3.5 space-y-2 transition-all ${cardBorder}`;
          card.innerHTML = `
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <button type="button" data-jump-target="script-${vid}" class="jump-to-script px-2 py-0.5 rounded text-xs font-extrabold bg-teal-600 hover:bg-teal-700 text-white transition-colors">単${item.num}</button>
                <span class="font-bold text-slate-900 text-sm sm:text-base">${escapeHtml(item.target)}</span>
                <span class="text-[11px] text-slate-400">行${item.lineId}</span>
              </div>
              ${
                st.graded
                  ? `<div class="flex items-center gap-1.5">
                      <span class="text-xs font-extrabold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">${isCorrect ? '⭕ 正解' : '❌ 不正解'}</span>
                      <button type="button" data-override-vocab="${vid}" class="btn-override-vocab px-2 py-0.5 rounded-lg text-[11px] font-bold border bg-white ${
                        isCorrect ? 'text-rose-600 border-rose-200 hover:bg-rose-50' : 'text-emerald-700 border-emerald-200 hover:bg-emerald-50'
                      }">${isCorrect ? '不正解にする' : '正解にする'}</button>
                    </div>`
                  : ''
              }
            </div>
            <input
              type="text"
              data-vocab-id="${vid}"
              value="${escapeHtml(val)}"
              autocomplete="off"
              placeholder="日本語の意味を入力..."
              class="vocab-input w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-600"
            />
            ${
              showModel
                ? `<div class="text-xs bg-white rounded-lg p-2.5 border border-teal-200/70 space-y-1">
                    <p><span class="font-bold text-emerald-700">模範解答：</span><span class="font-bold text-slate-900">${escapeHtml(item.ans)}</span></p>
                    <p class="text-slate-600"><span class="font-bold">解説：</span>${escapeHtml(item.exp)}</p>
                  </div>`
                : ''
            }
          `;
          sec.appendChild(card);
        });
        el.answerPane.appendChild(sec);
      }

      // 3. 前置詞・副詞 穴埋め一覧＆解説（インディゴ系）
      if (bKeys.length > 0) {
        const sec = document.createElement('div');
        sec.className = 'space-y-2.5';
        sec.innerHTML = `
          <h3 class="text-sm font-extrabold text-indigo-900 flex items-center gap-2 border-b border-indigo-100 pb-1.5">
            <span class="px-2 py-0.5 rounded bg-indigo-600 text-white text-xs">( )</span>
            前置詞・副詞 穴埋め一覧（${bKeys.length}問）
          </h3>
          <p class="text-[11px] text-slate-500">本文中の空欄に直接入力してください。採点後に正誤と解説が表示されます。</p>
        `;

        const list = document.createElement('div');
        list.className = 'space-y-2';

        bKeys.forEach((bid) => {
          const item = ps.blanks[bid];
          const userVal = (st.blanks[bid] || '').trim();
          const isCorrect = st.graded && item.ans.some((a) => a.toLowerCase() === userVal.toLowerCase());
          const showModel = st.graded || st.showAllModels;

          let cardStyle = 'border-slate-200 bg-slate-50/50';
          if (st.graded) {
            cardStyle = isCorrect ? 'border-emerald-300 bg-emerald-50/40' : 'border-rose-300 bg-rose-50/40';
          }

          const card = document.createElement('div');
          card.id = `card-${bid}`;
          card.className = `rounded-xl border p-3 text-xs space-y-1 transition-all ${cardStyle}`;
          card.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <button type="button" data-jump-target="script-${bid}" class="jump-to-script font-extrabold text-indigo-700 hover:underline">空欄 (${item.num}) を本文で見る（行${item.lineId}）</button>
              ${
                st.graded
                  ? `<span class="font-extrabold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">${
                      isCorrect ? '⭕ 正解' : `❌ 入力: ${escapeHtml(userVal || '無回答')}`
                    }</span>`
                  : `<span class="text-slate-400">${userVal ? `入力済: ${escapeHtml(userVal)}` : '未入力'}</span>`
              }
            </div>
            ${
              showModel
                ? `<div class="pt-1 text-slate-700">
                    <span class="font-extrabold text-indigo-700 mr-2">正解: ${escapeHtml(item.ans[0])}</span>
                    <span>${escapeHtml(item.exp)}</span>
                  </div>`
                : ''
            }
          `;
          list.appendChild(card);
        });

        sec.appendChild(list);
        el.answerPane.appendChild(sec);
      }

      // 単語入力イベント（IME安全）
      el.answerPane.querySelectorAll('.vocab-input').forEach((input) => {
        input.addEventListener('input', (e) => {
          st.vocabs[e.target.dataset.vocabId] = e.target.value;
        });
        input.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') {
            e.preventDefault();
            const all = [...el.answerPane.querySelectorAll('.vocab-input')];
            const idx = all.indexOf(e.target);
            if (idx >= 0 && idx + 1 < all.length) all[idx + 1].focus();
          }
        });
      });

      // 和訳入力イベント（本文内インライン表示へリアルタイム反映）
      el.answerPane.querySelectorAll('.trans-textarea').forEach((ta) => {
        ta.addEventListener('input', (e) => {
          const tid = e.target.dataset.transId;
          st.trans[tid] = e.target.value;
          const trimmed = e.target.value.trim();
          const wrap = el.scriptPane.querySelector(`[data-inline-user-wrap="${tid}"]`);
          const span = el.scriptPane.querySelector(`[data-inline-user-trans="${tid}"]`);
          if (wrap && span) {
            span.textContent = trimmed;
            wrap.classList.toggle('hidden', trimmed.length === 0);
          }
        });
      });

      // 手動単語判定トグル
      el.answerPane.querySelectorAll('.btn-override-vocab').forEach((btn) => {
        btn.addEventListener('click', () => {
          const vid = btn.dataset.overrideVocab;
          const cur = getVocabIsCorrect(scene.id, vid);
          st.vocabOverride[vid] = !cur;
          renderToolbar();
          renderAnswerPane();
          showToast(!cur ? '「正解」に切り替えました' : '「不正解」に切り替えました');
        });
      });

      // 和訳自己採点
      el.answerPane.querySelectorAll('.btn-trans-grade').forEach((btn) => {
        btn.addEventListener('click', () => {
          const [tid, grade] = btn.dataset.transGrade.split(':');
          st.transGrade[tid] = grade;
          renderToolbar();
          renderScriptPane();
          renderAnswerPane();
        });
      });

      // 解答用紙 → 本文ジャンプ
      el.answerPane.querySelectorAll('.jump-to-script').forEach((btn) => {
        btn.addEventListener('click', () => jumpToElement(btn.dataset.jumpTarget));
      });
    }

    function jumpToElement(targetId) {
      const target = document.getElementById(targetId);
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.remove('focus-flash');
      void target.offsetWidth;
      target.classList.add('focus-flash');
      const input = target.querySelector('input, textarea');
      if (input) setTimeout(() => input.focus({ preventScroll: true }), 240);
    }

    /**
     * ============================================================================
     * 8. アクション（バリエーション切替・採点・リセット・本番模試）
     * ============================================================================
     */
    function switchVariation(mode) {
      const sid = appState.activeSceneId;
      initSceneState(sid, mode);
      renderAll();
      const label = mode === 'A' ? 'パターンA' : mode === 'B' ? 'パターンB' : 'ランダム問題';
      showToast(`${label}を生成しました（前置詞・和訳・単語の重複なし ✓）`);
    }

    function gradeScene(sceneId, silent = false) {
      const st = sceneStates[sceneId];
      const ps = st.problemSet;

      Object.keys(ps.vocabs).forEach((vid) => {
        const userVal = (st.vocabs[vid] || '').trim().toLowerCase();
        const keys = ps.vocabs[vid].keys;
        st.vocabAuto[vid] = userVal.length > 0 && keys.some((k) => userVal.includes(k.toLowerCase()));
      });

      st.graded = true;
      // 採点時は本文内の各和訳行の真下に模範解答を自動表示
      st.showInlineTrans = true;

      if (!silent) {
        renderAll();
        showToast('採点しました！本文中の各和訳行の下に模範解答を表示しました。');
      }
    }

    function resetCurrentScene() {
      const sid = appState.activeSceneId;
      const st = sceneStates[sid];
      st.blanks = {};
      st.vocabs = {};
      st.vocabAuto = {};
      st.vocabOverride = {};
      st.trans = {};
      st.transGrade = {};
      st.graded = false;
      st.showInlineTrans = false;
      st.inlineTransOpen = {};
      st.showAllModels = false;
      renderAll();
      showToast('現在の問題の入力と採点結果をリセットしました');
    }

    function startMockExam() {
      const picked = shuffleArray(['1', '2', '3', '4', '5'])
        .slice(0, 3)
        .sort((a, b) => Number(a) - Number(b));

      picked.forEach((sid) => initSceneState(sid, 'R'));

      appState.mockMode = true;
      appState.mockScenes = picked;
      appState.activeSceneId = picked[0];
      renderAll();
      showToast(`本番模試を開始！（ランダム出題：場面${picked.join('・')}）`);
    }

    function openMockSummary() {
      appState.mockScenes.forEach((sid) => gradeScene(sid, true));
      renderAll();

      let sumBlankC = 0, sumBlankT = 0;
      let sumVocabC = 0, sumVocabT = 0;
      let sumTransOk = 0, sumTransClose = 0, sumTransT = 0;
      let breakdownHtml = '';

      appState.mockScenes.forEach((sid, idx) => {
        const s = getScene(sid);
        const sc = computeSceneScore(sid);
        sumBlankC += sc.blankCorrect; sumBlankT += sc.blankTotal;
        sumVocabC += sc.vocabCorrect; sumVocabT += sc.vocabTotal;
        sumTransOk += sc.transOk; sumTransClose += sc.transClose; sumTransT += sc.transTotal;

        breakdownHtml += `
          <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div class="font-bold text-sm text-slate-900">第${idx + 1}問：${escapeHtml(s.title)}</div>
            <div class="flex flex-wrap gap-1.5 text-xs font-bold">
              <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">前置詞 ${sc.blankCorrect}/${sc.blankTotal}</span>
              <span class="px-2 py-0.5 rounded bg-teal-100 text-teal-800">単語 ${sc.vocabCorrect}/${sc.vocabTotal}</span>
              <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900">和訳 ○${sc.transOk} △${sc.transClose}/${sc.transTotal}</span>
            </div>
          </div>
        `;
      });

      const autoTotal = sumBlankT + sumVocabT;
      const autoCorrect = sumBlankC + sumVocabC;
      const autoRate = autoTotal > 0 ? Math.round((autoCorrect / autoTotal) * 100) : 0;

      el.mockModalBody.innerHTML = `
        <div class="grid grid-cols-3 gap-2.5 sm:gap-3 text-center">
          <div class="p-3 rounded-xl bg-indigo-50 border border-indigo-100">
            <div class="text-[11px] font-bold text-indigo-700">前置詞合計</div>
            <div class="text-lg sm:text-xl font-extrabold text-slate-900 mt-0.5">${sumBlankC} <span class="text-xs text-slate-400">/ ${sumBlankT}</span></div>
          </div>
          <div class="p-3 rounded-xl bg-teal-50 border border-teal-100">
            <div class="text-[11px] font-bold text-teal-700">単語合計</div>
            <div class="text-lg sm:text-xl font-extrabold text-slate-900 mt-0.5">${sumVocabC} <span class="text-xs text-slate-400">/ ${sumVocabT}</span></div>
          </div>
          <div class="p-3 rounded-xl bg-amber-50 border border-amber-100">
            <div class="text-[11px] font-bold text-amber-800">和訳（自己採点）</div>
            <div class="text-sm sm:text-base font-extrabold text-slate-900 mt-1">○${sumTransOk} △${sumTransClose} <span class="text-xs text-slate-400">/ ${sumTransT}</span></div>
          </div>
        </div>
        <div class="text-center py-2.5 px-4 rounded-xl bg-emerald-50 border border-emerald-200 text-sm font-bold text-emerald-900">
          自動採点パート（前置詞＋単語）正答率：<span class="text-xl font-extrabold">${autoRate}%</span>（${autoCorrect} / ${autoTotal}問）
        </div>
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-slate-500">各場面の内訳</h3>
          ${breakdownHtml}
        </div>
        <p class="text-xs text-slate-500">※和訳の自己採点がまだの場合は、モーダルを閉じて各場面の「○ / △ / ×」を選んでから再度このボタンを押すと反映されます。</p>
      `;

      el.mockModal.classList.remove('hidden');
    }

    function toggleInlineTrans() {
      const st = sceneStates[appState.activeSceneId];
      if (st.showInlineTrans) {
        st.showInlineTrans = false;
        st.inlineTransOpen = {};
        if (st.showAllModels) st.showAllModels = false;
      } else {
        st.showInlineTrans = true;
      }
      renderToolbar();
      renderScriptPane();
    }

    function renderAll() {
      try {
        renderTabs();
        renderToolbar();
        renderScriptPane();
        renderAnswerPane();
      } catch (err) {
        console.error('Render error:', err);
        showToast('描画中にエラーが発生しました。ページを再読み込みしてください。');
      }
    }

    /**
     * ============================================================================
     * 9. イベントリスナー登録
     * ============================================================================
     */
    el.btnVarA.addEventListener('click', () => switchVariation('A'));
    el.btnVarB.addEventListener('click', () => switchVariation('B'));
    el.btnVarR.addEventListener('click', () => switchVariation('R'));

    el.btnGrade.addEventListener('click', () => gradeScene(appState.activeSceneId, false));
    el.btnToggleInlineTrans.addEventListener('click', toggleInlineTrans);
    el.btnHeaderToggleInlineTrans.addEventListener('click', toggleInlineTrans);

    el.btnToggleAllModels.addEventListener('click', () => {
      const st = sceneStates[appState.activeSceneId];
      st.showAllModels = !st.showAllModels;
      if (st.showAllModels) {
        st.showInlineTrans = true;
      } else {
        st.showInlineTrans = false;
        st.inlineTransOpen = {};
      }
      renderAll();
    });
    el.btnResetScene.addEventListener('click', resetCurrentScene);

    el.btnMockToggle.addEventListener('click', () => {
      if (appState.mockMode) {
        appState.mockMode = false;
        appState.mockScenes = [];
        renderAll();
        showToast('通常モードに戻りました');
      } else {
        startMockExam();
      }
    });

    el.btnMockSummary.addEventListener('click', openMockSummary);
    el.btnCloseModal.addEventListener('click', () => el.mockModal.classList.add('hidden'));
    el.mockModal.addEventListener('click', (e) => {
      if (e.target === el.mockModal) el.mockModal.classList.add('hidden');
    });
    el.btnMockNew.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      startMockExam();
    });
    el.btnMockExit.addEventListener('click', () => {
      el.mockModal.classList.add('hidden');
      appState.mockMode = false;
      appState.mockScenes = [];
      renderAll();
    });

    // 初期描画（DOM読み込み状態に関わらず確実に実行）
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderAll);
    } else {
      renderAll();
    }
  </script>
</body>
</html>
